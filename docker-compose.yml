services:
  mongodb:
    image: mongo:7
    container_name: borrowing_mongodb_v2
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: borrowing_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: borrowing_backend_v2
    restart: always
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:password123@mongodb:27017/borrowing_db?authSource=admin}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-qrcodeborrowdiwa}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: borrowing_frontend_v2
    restart: always
    ports:
      - "5174:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:
